<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Photo Gallery</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: #f4f4f4;
      padding: 20px;
    }

    h1{
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .gallery{
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .gallery img{
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      transition: 0.3s;
      cursor: pointer;
    }

    .gallery img:hover{
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Tablet View */
    @media (max-width: 992px){
      .gallery{
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Mobile View */
    @media (max-width: 768px){
      .gallery{
        grid-template-columns: repeat(2, 1fr);
      }

      .gallery img{
        height: 200px;
      }
    }

    /* Small Mobile View */
    @media (max-width: 480px){
      .gallery{
        grid-template-columns: 1fr;
      }

      .gallery img{
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <h1>Responsive Photo Gallery</h1>

  <div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="Photo">
    <img src="https://picsum.photos/id/1016/600/400" alt="Photo">
    <img src="https://picsum.photos/id/1018/600/400" alt="Photo">
    <img src="https://picsum.photos/id/1020/600/400" alt="Photo">
    <img src="https://picsum.photos/id/1024/600/400" alt="Photo">
    <img src="https://picsum.photos/id/1025/600/400" alt="Photo">
    <img src="https://picsum.photos/id/1035/600/400" alt="Photo">
    <img src="https://picsum.photos/id/1039/600/400" alt="Photo">
  </div>

</body>
</html>
