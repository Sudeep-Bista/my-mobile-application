

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobKhoj Nepal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo auth-logo"><i class="fa-solid fa-briefcase"></i> JobKhoj<span>Nepal</span></a>
            <h2>Welcome Back</h2>
            <p>Log in to manage your applications and saved jobs</p>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="example@gmail.com">
                    </div>
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••">
                    </div>
                    <span class="error-msg" id="passwordError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Log In</button>
            </form>
            <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
