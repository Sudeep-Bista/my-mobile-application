
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobKhoj Nepal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo auth-logo"><i class="fa-solid fa-briefcase"></i> JobKhoj<span>Nepal</span></a>
            <h2>Create Account</h2>
            <p>Join thousands of job seekers across Nepal today</p>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regName" placeholder="e.g., Ram Bahadur">
                    </div>
                    <span class="error-msg" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="ram@example.com">
                    </div>
                    <span class="error-msg" id="regEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="regPhone">Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="regPhone" placeholder="e.g., 98XXXXXXXX">
                    </div>
                    <span class="error-msg" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Minimum 6 characters">
                    </div>
                    <span class="error-msg" id="regPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regConfirmPassword" placeholder="Repeat your password">
                    </div>
                    <span class="error-msg" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Register Account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>

<script type="module" src="js/app.js"></script>
</body>
</html>
