

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Dashboard - JobKhoj Nepal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-briefcase"></i> JobKhoj<span>Nepal</span></a>
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="profile.html" class="nav-link active" id="navProfile">My Profile</a>
                <button id="logoutBtn" class="logout-link-btn"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
                <button id="themeToggle" class="theme-btn"><i class="fa-solid fa-moon"></i></button>
            </div>
            <div class="hamburger" id="hamburger">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </nav>

    <main class="container page-spacing">
        <div class="profile-layout">
            <section class="profile-card">
                <div class="profile-avatar">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="profName">Full Name</label>
                        <input type="text" id="profName" disabled required>
                    </div>
                    <div class="form-group">
                        <label for="profEmail">Email</label>
                        <input type="email" id="profEmail" disabled required>
                    </div>
                    <div class="form-group">
                        <label for="profPhone">Phone</label>
                        <input type="tel" id="profPhone" disabled required>
                    </div>
                    <div class="profile-actions">
                        <button type="button" id="editProfileBtn" class="btn btn-secondary"><i class="fa-solid fa-pen"></i> Edit Profile</button>
                        <button type="submit" id="saveProfileBtn" class="btn btn-primary" style="display: none;"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                    </div>
                </form>
            </section>

            <div class="tracking-panels">
                <section class="tracking-section">
                    <h2 class="section-title"><i class="fa-solid fa-paper-plane"></i> Applied Positions</h2>
                    <div class="table-responsive">
                        <table class="tracking-table">
                            <thead>
                                <tr>
                                    <th>Job Details</th>
                                    <th>Applied On</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="appliedJobsList">
                                </tbody>
                        </table>
                    </div>
                </section>

                <section class="tracking-section">
                    <h2 class="section-title"><i class="fa-solid fa-bookmark"></i> Saved Openings</h2>
                    <div class="jobs-grid" id="savedJobsGrid">
                        </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 JobKhoj Nepal. Built for professionals across Nepal.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
