<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Marks Result Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: rgb(248, 247, 253);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #5f5a5a;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        #total, #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Marks Calculator</h1>

        <input type="number" id="m1" placeholder="Enter Marks 1">
        <input type="number" id="m2" placeholder="Enter Marks 2">
        <input type="number" id="m3" placeholder="Enter Marks 3">
        <input type="number" id="m4" placeholder="Enter Marks 4">
        <input type="number" id="m5" placeholder="Enter Marks 5">
        <input type="number" id="m6" placeholder="Enter Marks 6">
        <input type="number" id="m7" placeholder="Enter Marks 7">
        <input type="number" id="m8" placeholder="Enter Marks 8">

        <button onclick="calculateResult()">Calculate Result</button>

        <p id="total"></p>
        <p id="result"></p>
    </div>

    <script>
        function calculateResult() {

            let totalMarks =
                Number(document.getElementById("m1").value) +
                Number(document.getElementById("m2").value) +
                Number(document.getElementById("m3").value) +
                Number(document.getElementById("m4").value) +
                Number(document.getElementById("m5").value) +
                Number(document.getElementById("m6").value) +
                Number(document.getElementById("m7").value) +
                Number(document.getElementById("m8").value);

            document.getElementById("total").innerHTML =
                "Total Marks: " + totalMarks + " / 800";

            if (totalMarks >= 700) {
                document.getElementById("result").innerHTML = "DISTINCTION";
                document.getElementById("result").style.color = "green";
            }
            else if (totalMarks >= 600) {
                document.getElementById("result").innerHTML =
                    "PASS – First Division";
                document.getElementById("result").style.color = "blue";
            }
            else if (totalMarks >= 500) {
                document.getElementById("result").innerHTML =
                    "PASS – Second Division";
                document.getElementById("result").style.color = "orange";
            }
            else if (totalMarks >= 400) {
                document.getElementById("result").innerHTML =
                    "PASS – Third Division";
                document.getElementById("result").style.color = "purple";
            }
            else {
                document.getElementById("result").innerHTML = "FAIL";
                document.getElementById("result").style.color = "red";
            }
        }
    </script>

</body>
</html>
